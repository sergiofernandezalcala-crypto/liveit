<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>eablo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Comfortaa:wght@300&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #111111;
  --ink2:    #555555;
  --ink3:    #999999;
  --paper:   #FAFAF8;
  --white:   #FFFFFF;
  --green:   #00E676;
  --green-dk:#00C853;
  --border:  #E8E8E4;
  --r:       14px;
  --sans:    'DM Sans', system-ui, sans-serif;
  --brand:   'Comfortaa', var(--sans);
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 1.2rem 1.5rem 0.8rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.wordmark {
  font-family: var(--brand);
  font-size: 1.6rem;
  font-weight: 300;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.wordmark span { color: var(--green); }

.header-hint {
  font-size: 0.75rem;
  color: var(--ink3);
  font-style: italic;
}

main {
  flex: 1;
  padding: 0.5rem 1.5rem 2rem;
  max-width: 520px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}

#privacy-notice {
  background: #f0faf5;
  border: 1px solid #b2dfcc;
  border-radius: var(--r);
  padding: 0.9rem 1rem;
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
}
#privacy-notice.hidden { display: none; }
.privacy-icon { font-size: 1rem; flex-shrink: 0; margin-top: 0.05rem; }
.privacy-text { font-size: 0.8rem; color: #2e7d5e; line-height: 1.5; flex: 1; }
.privacy-close {
  background: none; border: none; cursor: pointer;
  color: #2e7d5e; font-size: 1rem; flex-shrink: 0;
  padding: 0; line-height: 1;
}

.section-label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.4rem;
}

.input-block { display: flex; flex-direction: column; }

textarea#msg {
  width: 100%;
  min-height: 120px;
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 0.9rem 1rem;
  font-family: var(--sans);
  font-size: 0.95rem;
  color: var(--ink);
  background: var(--white);
  resize: none;
  line-height: 1.55;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
textarea#msg:focus { outline: none; border-color: var(--ink); }
textarea#msg::placeholder { color: var(--ink3); }

.options-row {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.pill {
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  font-size: 0.82rem;
  font-family: var(--sans);
  color: var(--ink2);
  background: var(--white);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  -webkit-appearance: none;
}
.pill:hover { border-color: var(--ink2); color: var(--ink); }
.pill.active {
  border-color: var(--green);
  background: var(--green);
  color: var(--ink);
  font-weight: 600;
}

#btn-go {
  width: 100%;
  background: var(--green);
  color: var(--ink);
  border: none;
  border-radius: var(--r);
  padding: 0.95rem;
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  -webkit-appearance: none;
}
#btn-go:active { transform: scale(0.98); }
#btn-go:disabled { opacity: 0.4; cursor: not-allowed; }

#loading {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  padding: 1.5rem 0;
}
#loading.visible { display: flex; }
.dots { display: flex; gap: 0.4rem; }
.dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: bounce 1.2s infinite;
}
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-8px); }
}
.loading-text { font-size: 0.85rem; color: var(--ink3); font-style: italic; }

#situation-read {
  display: none;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 0.9rem 1rem;
  font-size: 0.88rem;
  color: var(--ink2);
  line-height: 1.5;
  font-style: italic;
}
#situation-read.visible { display: block; }

#replies { display: none; flex-direction: column; gap: 0.75rem; }
#replies.visible { display: flex; }

.reply-card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 1rem;
  cursor: pointer;
  transition: border-color 0.15s;
  position: relative;
}
.reply-card:hover { border-color: var(--green); }
.reply-card:active { transform: scale(0.99); }

.reply-tone {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.4rem;
}
.reply-text {
  font-size: 0.95rem;
  color: var(--ink);
  line-height: 1.55;
}
.reply-copy {
  position: absolute;
  top: 0.8rem; right: 0.8rem;
  background: none; border: none;
  font-size: 1rem; cursor: pointer;
  opacity: 0.3; transition: opacity 0.15s;
  padding: 0;
}
.reply-card:hover .reply-copy { opacity: 0.7; }
.reply-copy.copied { opacity: 1; }

.feedback-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.4rem;
}
.fb-btn {
  background: none; border: none; cursor: pointer;
  font-size: 0.75rem; color: var(--ink3);
  padding: 0; font-family: var(--sans);
  transition: color 0.15s;
}
.fb-btn:hover { color: var(--ink); }

#btn-new {
  display: none;
  width: 100%;
  background: none;
  color: var(--ink2);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  font-family: var(--sans);
  font-size: 0.9rem;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  -webkit-appearance: none;
}
#btn-new:hover { border-color: var(--ink2); color: var(--ink); }
#btn-new.visible { display: block; }

#history-block { display: flex; flex-direction: column; }
.history-list { display: flex; flex-direction: column; gap: 0.4rem; }

.history-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 0.6rem 0.8rem;
  cursor: pointer;
  transition: border-color 0.15s;
}
.history-item:hover { border-color: #ccc; }

.history-info { flex: 1; min-width: 0; }
.history-relation { font-size: 0.8rem; font-weight: 600; color: var(--ink); }
.history-snippet {
  font-size: 0.75rem; color: var(--ink3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.history-time { font-size: 0.7rem; color: var(--ink3); white-space: nowrap; }
.history-delete {
  background: none; border: none; cursor: pointer;
  font-size: 1rem; color: var(--ink3);
  padding: 0.2rem; transition: color 0.15s;
  flex-shrink: 0;
}
.history-delete:hover { color: #e53935; }
.history-empty {
  font-size: 0.8rem; color: var(--ink3); font-style: italic;
  padding: 0.4rem 0;
}
</style>
</head>
<body>

<header>
  <div class="wordmark">ea<span>b</span>lo</div>
  <div class="header-hint">para cuando no debes responder tú solo</div>
</header>

<main>

  <div id="privacy-notice">
    <span class="privacy-icon">🔒</span>
    <span class="privacy-text">Las últimas 3 conversaciones se guardan <strong>solo en este dispositivo</strong> para darte mejor contexto. Nunca salen de aquí.</span>
    <button class="privacy-close" onclick="dismissPrivacy()">✕</button>
  </div>

  <div class="input-block">
    <div class="section-label">Mensaje recibido</div>
    <textarea id="msg" placeholder="Pega aquí lo que te han escrito…" rows="5"></textarea>
  </div>

  <div>
    <div class="section-label">¿Quién te escribe?</div>
    <div class="options-row" id="relation-pills">
      <button class="pill" data-val="pareja">Pareja</button>
      <button class="pill" data-val="amigo/a">Amigo/a</button>
      <button class="pill" data-val="familia">Familia</button>
      <button class="pill" data-val="trabajo">Trabajo</button>
      <button class="pill" data-val="otro">Otro</button>
    </div>
  </div>

  <div>
    <div class="section-label">¿Qué quieres conseguir?</div>
    <div class="options-row" id="goal-pills">
      <button class="pill" data-val="calmar la situación">Calmar</button>
      <button class="pill" data-val="disculparme">Disculparme</button>
      <button class="pill" data-val="poner límites">Poner límites</button>
      <button class="pill" data-val="no entrar en discusión">No discutir</button>
      <button class="pill" data-val="reconectar">Reconectar</button>
    </div>
  </div>

  <button id="btn-go" onclick="generate()">Ayúdame a responder</button>

  <div id="loading">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="loading-text">Leyendo la situación…</div>
  </div>

  <div id="situation-read"></div>
  <div id="replies"></div>

  <button id="btn-new" onclick="resetForm()">← Nueva consulta</button>

  <div id="history-block">
    <div class="section-label">Conversaciones recientes</div>
    <div class="history-list" id="history-list"></div>
  </div>

</main>

<script>
const STORAGE_KEY = 'eablo_history';
const MAX_HISTORY = 3;
let selectedRelation = '';
let selectedGoal = '';

function dismissPrivacy() {
  document.getElementById('privacy-notice').classList.add('hidden');
  localStorage.setItem('eablo_privacy_ok', '1');
}
if (localStorage.getItem('eablo_privacy_ok')) {
  document.getElementById('privacy-notice').classList.add('hidden');
}

document.querySelectorAll('#relation-pills .pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#relation-pills .pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedRelation = btn.dataset.val;
  });
});

document.querySelectorAll('#goal-pills .pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#goal-pills .pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedGoal = btn.dataset.val;
  });
});

function getHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveHistory(h) { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }

function addToHistory(relation, snippet, message) {
  const h = getHistory();
  h.unshift({ id: Date.now(), relation, snippet, message, ts: Date.now() });
  if (h.length > MAX_HISTORY) h.splice(MAX_HISTORY);
  saveHistory(h);
  renderHistory();
}
function deleteHistoryItem(id) {
  saveHistory(getHistory().filter(h => h.id !== id));
  renderHistory();
}
function timeAgo(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 3600) return `hace ${Math.round(d/60)}m`;
  if (d < 86400) return `hace ${Math.round(d/3600)}h`;
  return `hace ${Math.round(d/86400)}d`;
}
function renderHistory() {
  const list = document.getElementById('history-list');
  const h = getHistory();
  if (!h.length) { list.innerHTML = '<div class="history-empty">Sin conversaciones recientes</div>'; return; }
  list.innerHTML = h.map(item => `
    <div class="history-item" onclick="loadHistory(${item.id})">
      <div class="history-info">
        <div class="history-relation">${item.relation}</div>
        <div class="history-snippet">${item.snippet}</div>
      </div>
      <div class="history-time">${timeAgo(item.ts)}</div>
      <button class="history-delete" onclick="event.stopPropagation();deleteHistoryItem(${item.id})" title="Eliminar">🗑</button>
    </div>
  `).join('');
}
function loadHistory(id) {
  const item = getHistory().find(h => h.id === id);
  if (!item) return;
  document.getElementById('msg').value = item.message;
  document.querySelectorAll('#relation-pills .pill').forEach(b => {
    b.classList.toggle('active', b.dataset.val === item.relation);
    if (b.dataset.val === item.relation) selectedRelation = item.relation;
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function generate() {
  const msg = document.getElementById('msg').value.trim();
  if (!msg) { alert('Pega el mensaje que recibiste.'); return; }
  if (!selectedRelation) { alert('¿Quién te escribe?'); return; }
  if (!selectedGoal) { alert('¿Qué quieres conseguir?'); return; }

  document.getElementById('btn-go').disabled = true;
  document.getElementById('loading').classList.add('visible');
  document.getElementById('situation-read').classList.remove('visible');
  document.getElementById('replies').classList.remove('visible');
  document.getElementById('btn-new').classList.remove('visible');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        receivedMessage: msg,
        relation: selectedRelation,
        goal: selectedGoal,
        history: getHistory().map(h => ({ relation: h.relation, snippet: h.snippet }))
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Error');

    const r = data.replies;
    const sr = document.getElementById('situation-read');
    sr.textContent = r.situation_read;
    sr.classList.add('visible');

    const repliesEl = document.getElementById('replies');
    repliesEl.innerHTML = [
      { text: r.reply1, tone: r.tone1 },
      { text: r.reply2, tone: r.tone2 },
      { text: r.reply3, tone: r.tone3 }
    ].map((rep, i) => `
      <div class="reply-card">
        <div class="reply-tone">${rep.tone}</div>
        <div class="reply-text">${rep.text}</div>
        <button class="reply-copy" onclick="copyReply(this, ${JSON.stringify(rep.text)})" title="Copiar">📋</button>
        <div class="feedback-row">
          <button class="fb-btn" onclick="feedback(${i},'good')">👍 Así hablaría</button>
          <button class="fb-btn" onclick="feedback(${i},'bad')">👎 No es mi estilo</button>
        </div>
      </div>
    `).join('');
    repliesEl.classList.add('visible');

    addToHistory(selectedRelation, msg.length > 50 ? msg.slice(0,50)+'…' : msg, msg);
    document.getElementById('btn-new').classList.add('visible');

  } catch (err) {
    alert('Algo ha ido mal. Inténtalo de nuevo.');
    console.error(err);
  } finally {
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('btn-go').disabled = false;
  }
}

function copyReply(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅';
    setTimeout(() => { btn.textContent = '📋'; }, 1500);
  });
}

function feedback(index, type) {
  const row = document.querySelectorAll('.reply-card')[index]?.querySelector('.feedback-row');
  if (row) row.innerHTML = `<span style="font-size:0.75rem;color:var(--ink3)">${type==='good'?'✓ Guardado':'✓ Anotado'}</span>`;
}

function resetForm() {
  document.getElementById('msg').value = '';
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  selectedRelation = ''; selectedGoal = '';
  document.getElementById('situation-read').classList.remove('visible');
  document.getElementById('replies').classList.remove('visible');
  document.getElementById('btn-new').classList.remove('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderHistory();
</script>
</body>
</html>
