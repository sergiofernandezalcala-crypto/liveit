<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eablo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&family=Comfortaa:wght@300&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #111111;
  --ink2:    #555555;
  --ink3:    #999999;
  --paper:   #FAFAF8;
  --white:   #FFFFFF;
  --lime:    #00E676;
  --lime-dk: #00C853;
  --sky:     #E8FFF2;
  --coral:   #00E676;
  --border:  #E8E8E4;
  --r:       12px;
  --sans:    'DM Sans', system-ui, sans-serif;
  --serif:   'DM Serif Display', Georgia, serif;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── SETUP ─────────────────────────────────── */
#setup {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  padding: 1.5rem;
  background: var(--white);
  overflow: hidden;
}

.setup-top {
  width: 100%;
  max-width: 400px;
  margin-bottom: 1.5rem;
  padding-top: 1.5rem;
}

.wordmark {
  font-family: 'Comfortaa', var(--sans);
  font-size: 3rem;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.01em;
}

.wordmark span {
  color: #00E676;
}

.sub {
  margin-top: 0.5rem;
  font-size: 1rem;
  color: #444;
  letter-spacing: 0.02em;
  font-style: italic;
}

.setup-main {
  width: 100%;
  max-width: 400px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.75rem;
}

.setup-label {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--ink);
}

.setup-hint {
  font-size: 0.92rem;
  color: var(--ink);
  line-height: 1.5;
  margin-top: -0.25rem;
}

textarea.sit-input {
  width: 100%;
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 0.75rem 1rem;
  font-size: 0.9rem;
  font-family: var(--sans);
  color: var(--ink);
  line-height: 1.55;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  overflow: hidden;
}
textarea.sit-input:focus { border-color: var(--ink); }
textarea.sit-input::placeholder { color: #888; }

.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.example-chip {
  padding: 0.35rem 0.75rem;
  background: #E8FFF2;
  border: none;
  border-radius: 10px;
  font-size: 0.78rem;
  color: var(--ink);
  cursor: pointer;
  font-family: var(--sans);
  transition: background 0.15s;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  width: 100%;
}
.example-chip:hover { background: #C8F5DC; }
.recent-label { font-size: 0.68rem; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
.recent-chip {
  display: block;
  width: 100%;
  padding: 0.45rem 0.75rem;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.8rem;
  color: var(--ink2);
  cursor: pointer;
  font-family: var(--sans);
  text-align: left;
  margin-bottom: 0.3rem;
  transition: border-color 0.15s;
}
.recent-chip:hover { border-color: #00E676; color: var(--ink); }
.recent-chip-wrap { display: flex; align-items: center; justify-content: space-between; padding: 0.35rem 0.65rem; background: var(--white); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.2rem; }
.recent-chip-text { font-size: 0.75rem; color: var(--ink2); flex: 1; }
.recent-chip-btn { background: #00E676; border: none; border-radius: 6px; padding: 0.2rem 0.6rem; font-size: 0.72rem; font-weight: 700; color: var(--ink); cursor: pointer; font-family: var(--sans); white-space: nowrap; margin-left: 0.5rem; }
.recent-chip-btn:hover { opacity: 0.8; }
.chip-main { font-weight: 600; color: #111; font-size: 1rem; }
.chip-sub  { font-size: 0.8rem; color: #555; }

.btn-go {
  width: 100%;
  padding: 1rem;
  background: var(--lime);
  color: var(--ink);
  border: none;
  border-radius: var(--r);
  font-size: 1rem;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn-go:hover { background: var(--lime-dk); }
.btn-go:active { transform: scale(0.98); }

.setup-bottom {
  width: 100%;
  max-width: 400px;
  margin-top: auto;
  padding-bottom: 1.5rem;
  font-size: 0.72rem;
  color: var(--ink3);
  text-align: center;
}

/* ── EXPERIENCE ─────────────────────────────── */
#experience {
  display: none;
  flex-direction: column;
  height: 100dvh;
  background: var(--white);
}

/* Scene strip */
.scene-strip {
  flex-shrink: 0;
  height: 56px;
  background: var(--ink);
  display: flex;
  align-items: center;
  padding: 0 1rem;
  gap: 0.75rem;
}

.scene-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--lime);
  flex-shrink: 0;
}

.scene-name {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.char-pill {
  font-size: 0.72rem;
  color: var(--lime);
  font-weight: 600;
  white-space: nowrap;
}

/* Avatar + dialogue */


.avatar-wrap {
  flex-shrink: 0;
  width: 52px; height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.avatar-wrap svg { width: 52px; height: 52px; }

.dialogue-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.char-name-tag {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.char-line {
  font-size: 1.05rem;
  line-height: 1.45;
  color: var(--ink);
  font-weight: 500;
}
.char-line.pop { animation: pop 0.3s ease; }
@keyframes pop { from{opacity:0;transform:translateY(2px)} to{opacity:1;transform:translateY(0)} }

.subtitle {
  font-size: 0.8rem;
  color: var(--ink3);
  font-style: italic;
  line-height: 1.4;
  transition: all 0.4s;
}
.subtitle.hidden { display: none; }
.subtitle.soft { opacity: 0.5; }

.sub-reveal {
  background: none;
  border: none;
  font-size: 0.68rem;
  color: var(--lime);
  cursor: pointer;
  font-family: var(--sans);
  padding: 0;
  margin-top: 0.1rem;
  display: none;
}

.speaking-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--coral);
  display: none;
  animation: blink 0.8s ease infinite;
  flex-shrink: 0;
  margin-top: 0.6rem;
}
.speaking-dot.on { display: block; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }

/* NM card */
.nm-card {
  display: none;
  margin: 0.5rem 1rem 0;
  padding: 0.6rem 0.85rem;
  background: #F0FFF6;
  border: 1.5px solid #00E676;
  border-radius: var(--r);
  flex-direction: column;
  gap: 0.25rem;
}
.nm-card.on { display: flex; }
.nm-tag { font-size: 0.6rem; font-weight: 700; color: #007A3D; letter-spacing: 0.1em; text-transform: uppercase; }
.nm-phrase { font-size: 0.97rem; font-weight: 600; color: #007A3D; }
.nm-actions { display: flex; gap: 0.4rem; margin-top: 0.1rem; }
.nm-btn {
  padding: 0.22rem 0.65rem;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: var(--sans);
  transition: opacity 0.15s;
}
.nm-btn:hover { opacity: 0.75; }
.nm-listen { background: #00E676; color: white; }
.nm-skip   { background: transparent; color: var(--ink3); border: 1px solid var(--border); }

/* History */
.history {
  flex: 1;
  overflow-y: auto;
  padding: 0.9rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  background: var(--paper);
}
.history::-webkit-scrollbar { width: 3px; }
.history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 82%;
  padding: 0.65rem 1rem;
  border-radius: 14px;
  font-size: 1.05rem;
  line-height: 1.5;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

.msg-char {
  align-self: flex-start;
  background: var(--white);
  border: 1px solid var(--border);
  border-left: 3px solid #00E676;
  border-bottom-left-radius: 3px;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s;
}
.msg-char:hover { background: #f5fff8; }
.msg-user {
  align-self: flex-end;
  background: var(--ink);
  color: white;
  border-bottom-right-radius: 3px;
  cursor: pointer;
  transition: background 0.15s;
}
.msg-user:hover { background: #333333; }
.msg-system {
  align-self: center;
  font-size: 0.7rem;
  color: var(--ink3);
  background: transparent;
  padding: 0.1rem;
}

.msg-en { display: block; }
.msg-sub { display: block; font-size: 0.88rem; color: #555; margin-top: 0.2rem; font-style: italic; }

.nm-hist {
  align-self: flex-end;
  max-width: 82%;
  padding: 0.4rem 0.75rem;
  background: #F0FFF6;
  border: 1px solid #00E676;
  border-radius: 10px;
  border-bottom-right-radius: 3px;
  animation: fadeIn 0.25s ease;
}
.nm-hist-tag { font-size: 0.58rem; font-weight: 700; color: #007A3D; letter-spacing: 0.08em; text-transform: uppercase; display: block; }
.nm-hist-phrase { font-size: 0.82rem; color: #007A3D; font-style: italic; font-weight: 500; display: block; }
.nm-hist-actions { display: flex; gap: 0.4rem; margin-top: 0.35rem; }
.nm-hist-user { display: block; font-size: 0.78rem; color: #555; margin-bottom: 0.25rem; font-style: normal; }

.thinking {
  display: none;
  align-self: flex-start;
  align-items: center;
  gap: 4px;
  padding: 0.4rem 0.65rem;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  border-bottom-left-radius: 3px;
}
.thinking.on { display: flex; }
.thinking span {
  width: 5px; height: 5px;
  background: var(--ink3);
  border-radius: 50%;
  animation: bounce 1.1s ease infinite;
}
.thinking span:nth-child(2) { animation-delay: 0.18s; }
.thinking span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-4px)} }

.cont-btn {
  align-self: center;
  padding: 0.4rem 1rem;
  background: var(--lime); color: white;
  color: var(--ink);
  border: none;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--sans);
}

/* Input */
.input-zone {
  flex-shrink: 0;
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 0.65rem 0.9rem;
}

.input-row { display: flex; align-items: center; gap: 0.45rem; }

.text-input {
  flex: 1;
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 0.6rem 1rem;
  color: var(--ink);
  font-size: 0.88rem;
  font-family: var(--sans);
  outline: none;
  resize: none;
  transition: border-color 0.2s;
}
.text-input:focus { border-color: var(--ink); }
.text-input::placeholder { color: var(--ink3); }

.btn-mic, .btn-send {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.btn-mic { background: var(--paper); border: 1.5px solid var(--border); color: var(--ink2); }
.btn-mic.rec { background: #FF3B30; border-color: #FF3B30; color: white; }
.btn-send { background: var(--ink); color: white; }
.btn-send:hover { opacity: 0.8; }
.btn-send:disabled { opacity: 0.25; }
.btn-mic svg, .btn-send svg { width: 16px; height: 16px; }

.hint { margin-top: 0.3rem; font-size: 0.85rem; color: #555; text-align: center; }

/* Ending */
#ending {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--white);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
  animation: fadeIn 0.4s ease;
}
.ending-badge {
  width: 64px; height: 64px;
  background: var(--lime);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  margin-bottom: 1.2rem;
}
.ending-title { font-family: var(--serif); font-size: 1.8rem; color: var(--ink); margin-bottom: 0.5rem; }
.ending-sub { font-size: 0.88rem; color: var(--ink2); line-height: 1.6; max-width: 280px; margin-bottom: 2rem; }
.ending-acts { display: flex; flex-direction: column; gap: 0.6rem; width: 100%; max-width: 260px; }
.btn-new { padding: 0.9rem; background: var(--lime); color: var(--ink); border: none; border-radius: var(--r); font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: var(--sans); }
.btn-copy { padding: 0.8rem; background: transparent; color: var(--ink2); border: 1.5px solid var(--border); border-radius: var(--r); font-size: 0.88rem; font-weight: 600; cursor: pointer; font-family: var(--sans); }

/* ── MOOD PALETTES ───────────────────────────── */
.mood-hotel    { --scene-a: #0f2027; --scene-b: #203a43; --scene-c: #2c5364; --scene-txt: #c9a84c; }
.mood-cafe     { --scene-a: #2c1503; --scene-b: #6b3a1f; --scene-c: #c8793a; --scene-txt: #ffd9a8; }
.mood-fashion  { --scene-a: #1a0a1e; --scene-b: #4a1560; --scene-c: #9b30c0; --scene-txt: #f0c6ff; }
.mood-airport  { --scene-a: #071330; --scene-b: #0d2b6b; --scene-c: #1565c0; --scene-txt: #90caf9; }
.mood-bar      { --scene-a: #1a0000; --scene-b: #4a0a0a; --scene-c: #8b1a1a; --scene-txt: #ffb347; }
.mood-market   { --scene-a: #0d2600; --scene-b: #1b5e20; --scene-c: #388e3c; --scene-txt: #b9f6ca; }
.mood-taxi     { --scene-a: #1a1500; --scene-b: #4a3f00; --scene-c: #f9a825; --scene-txt: #fff9c4; }
.mood-beach    { --scene-a: #003d6b; --scene-b: #0077b6; --scene-c: #48cae4; --scene-txt: #ffe0a3; }
.mood-default  { --scene-a: #111111; --scene-b: #2a2a2a; --scene-c: #444444; --scene-txt: #00E676; }

.scene-strip {
  background: linear-gradient(90deg, var(--scene-a) 0%, var(--scene-b) 60%, var(--scene-c) 100%) !important;
  transition: background 0.8s ease;
}

.scene-dot { background: var(--scene-txt) !important; }
.char-pill { color: var(--scene-txt) !important; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <div class="setup-top">
    <div class="wordmark" style="cursor:pointer;" onclick="if(document.getElementById('experience').style.display==='flex'){newSit();}"><span style="color:#00E676;">e</span><span style="color:#111111;">ablo</span></div>
    <div class="sub">Vive en inglés, mientras lo aprendes.</div>
  </div>

  <div class="setup-main">
    <div class="setup-label">¿Dónde quieres estar?</div>
    <div class="setup-hint">Describe la situación. El personaje hablará en inglés. Tú responde como quieras.</div>
    <textarea class="sit-input" id="sit-input" rows="2"
      placeholder="Ej: Acabo de llegar a un hotel en Tokio y necesito hacer el check-in." oninput="autoResizeSit(this)"></textarea>
    <div id="lang-hint-setup" style="font-size:0.72rem;color:var(--ink3);"></div>
    <div class="examples" style="flex-direction:column;">
      <button class="example-chip" onclick="setExample(this)">
        <span class="chip-main">Me han perdido la maleta</span>
        <span class="chip-sub">Bangkok · Aeropuerto</span>
      </button>
      <button class="example-chip" onclick="setExample(this)">
        <span class="chip-main">Quiero regatear en el mercado</span>
        <span class="chip-sub">Marrakech · Mercado</span>
      </button>
      <button class="example-chip" onclick="setExample(this)">
        <span class="chip-main">El camarero no me entiende</span>
        <span class="chip-sub">Roma · Restaurante</span>
      </button>
    </div>
    <button class="btn-go" onclick="startExperience()">Entrar en la situación →</button>
    <div id="recent-situations" style="display:none;margin-top:1rem;"></div>
  </div>



</div>

<!-- EXPERIENCE -->
<div id="experience">
  <div class="scene-strip">
    <button onclick="goHome()" style="background:rgba(255,255,255,0.12);border:none;color:white;cursor:pointer;font-size:0.75rem;font-weight:600;font-family:var(--sans);padding:0.3rem 0.7rem;border-radius:20px;margin-right:0.4rem;white-space:nowrap;">↺ Empezar</button>
    <div class="scene-dot"></div>
    <div class="scene-name" id="scene-name"></div>

  </div>

  <div style="display:none">
    <div id="avatar-wrap"></div>

    <div id="char-line"></div>
    <div id="subtitle"></div>
    <button id="sub-reveal"></button>
    <div id="speaking-dot"></div>
  </div>



  <div class="history" id="history">
    <div class="thinking" id="thinking"><span></span><span></span><span></span></div>
  </div>

  <div class="input-zone">
    <div class="input-row">
      <button class="btn-mic" id="mic-btn" onclick="toggleMic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <textarea id="user-input" class="text-input" rows="1"
        placeholder="Escribe en español o en inglés…"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="send-btn" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="hint" id="lang-hint-exp"></div>
  </div>
</div>

<!-- ENDING -->
<div id="ending">
  <div class="ending-badge">✓</div>
  <div class="ending-title">Situación completada</div>
  <div class="ending-sub" id="ending-sub"></div>
  <div class="ending-acts">
    <button class="btn-new" onclick="newSit()">Nueva situación →</button>
    <button class="btn-copy" onclick="copyConv()">📋 Copiar conversación</button>
  </div>
</div>

<script>
const PROXY = '/api/chat';

// ── LANGUAGE DETECTION ────────────────────────
const userLang = (navigator.language || navigator.userLanguage || 'es').split('-')[0].toLowerCase();
const langHints = {
  es: ['Escribe en español, o como te suene en inglés. También puedes dictarlo.', 'Escribe en español, o como te suene en inglés. También puedes dictarlo.'],
  fr: ['Tu peux écrire en français à tout moment.', 'Français ou anglais — la situation continue.'],
  pt: ['Podes escrever em português a qualquer momento.', 'Português ou inglês — a situação não para.'],
  it: ['Puoi scrivere in italiano in qualsiasi momento.', 'Italiano o inglese — la situazione continua.'],
  de: ['Du kannst jederzeit auf Deutsch schreiben.', 'Deutsch oder Englisch — die Situation läuft weiter.'],
  nl: ['Je kunt op elk moment in het Nederlands schrijven.', 'Nederlands of Engels — de situatie gaat door.'],
  pl: ['Możesz pisać po polsku w dowolnym momencie.', 'Polski lub angielski — sytuacja trwa.'],
  ru: ['Вы можете писать по-русски в любое время.', 'Русский или английский — ситуация продолжается.'],
  zh: ['您可以随时用中文书写。', '中文或英文 — 情景不会中断。'],
  ja: ['いつでも日本語で書けます。', '日本語または英語 — 状況は続きます。'],
  ar: ['يمكنك الكتابة بالعربية في أي وقت.', 'عربي أو إنجليزي — الموقف لا يتوقف.'],

// ── PROMPT ────────────────────────────────────
function buildPrompt() {
  return `You are a character in this situation: "${situation}"

Stay in character throughout as a real person would. Do not introduce yourself by name unless the user asks.

The user's native language may not be Spanish or English — they could be a speaker of any language. Always provide subtitle_es in their native language if possible, but Spanish as fallback. The user may write in any language — always understand and continue. IMPORTANT: the user may also write phonetic English based on their native language (e.g. a Spanish speaker writing 'tenquiu' for 'thank you', 'ai wont' for 'I want', 'jau ar yu' for 'how are you'; a French speaker writing 'sank you' or 'allo'; a Japanese speaker writing 'sank yu' etc). Always recognize and accept phonetic English as valid English input — treat it as correct and continue naturally. Always understand their intention and continue — never say you don't understand, never break character.

If the user says something grammatically imperfect, naturally reflect the correct form in your reply without explicitly correcting them.

One very short sentence per turn. Use the simplest English possible — like talking to a child learning the language. Basic words only: yes, no, here, how many, what, your name, please, thank you. No complex vocabulary, no long sentences, no formal language.

When the user has achieved their goal, set situation_ended to true.

Always use the most basic English words. If there is a simpler word, use it. Never use formal or complex language.

IMPORTANT: subtitle_es must ALWAYS be filled with the Spanish translation of your line — never leave it empty. Always use correct grammar — "You're welcome" not "You welcome". Match the user's tone and register: if they are casual and relaxed, respond casually; if formal, respond formally. Mirror their energy naturally, as a real person would.

For natural_model — this is CRITICAL:
- It must ALWAYS contain the most natural English version of exactly what THE USER wrote
- It is NEVER your response to the user — it is the user's own words improved
- Examples: user writes "helo you want one shirt black medium" → natural_model: "Hi, I'd like a black shirt in medium, please"
- User writes "quiero una camiseta" → natural_model: "I'd like a shirt, please"
- User writes "tenquiu" → natural_model: "Thank you"
- NEVER copy your own line into natural_model

For expects_user_input:
- Set FALSE when you perform an action ("let me get", "here you go", "let me check") — the scene continues automatically
- Set FALSE when you make a statement that doesn't need a response
- Set TRUE only when you ask the user a direct question that needs their answer

For mood → choose: hotel, cafe, fashion, airport, bar, market, taxi, beach, or default`;
}

// ── AI ────────────────────────────────────────
async function callAI(userMsg) {
  // Keep only last 10 messages to avoid context bloat
  const msgs = hist.slice(-10);
  if (userMsg) msgs.push({ role: 'user', content: userMsg });
  const res = await fetch(PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system: buildPrompt(), messages: msgs, temperature: 0.7, max_tokens: 300 })
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'Error'); }
  const data = await res.json();
  // Read structured output from tool_result block (proxy wraps it)
  const block = data.content && data.content.find(b => b.type === 'tool_result');
  const p = block ? block.input : null;
  if (!p || !p.line) throw new Error('Invalid response');
  p.situation_ended    = p.situation_ended    === true || p.situation_ended    === 'true';
  p.expects_user_input = p.expects_user_input !== false && p.expects_user_input !== 'false';
  p.natural_model      = p.natural_model || '';
  p.subtitle_es        = p.subtitle_es || '';
  return p;
}

  document.getElementById('user-input').placeholder = getInputPlaceholder();

      if (m.role === 'user' && m.nm) {

        if (lastEl) {

        showThinking(false);

        hist.push({ role: 'assistant', content: ai.line });
        handleCont(ai);
      })
      .catch(function() { showThinking(false); });
  }
}

// ── CONTINUATION ──────────────────────────────
function handleCont(ai) {
  // If line ends with ? it always expects user input regardless of model flag
  const hasQuestion = /\?/.test(ai.line || '');
  if (hasQuestion) { autoCont = 0; return; }
  if (!ai.expects_user_input && autoCont < 1) {
    autoCont++;
    setTimeout(autoContinue, 1200);
  }
  // No continuar button — user writes when ready
}

async function autoContinue() {
  showThinking(true);
  hist.push({ role: 'user', content: '(continue — advance the situation naturally)' });
  try {
    const ai = await callAI(null);
    showThinking(false);
    showLine(ai.line, ai.subtitle_es);
    addMsg('char', ai.line, ai.subtitle_es);
    hist.push({ role: 'assistant', content: ai.line });
    // nm handled inline in user bubble
    handleCont(ai);
  } catch(e) { showThinking(false); }
}

function applyChar(ai) {
  if (ai.char_name && ai.char_name !== charName) {
    charName = ai.char_name; charRole = ai.char_role || '';
    // char-name-tag hidden
    // char-pill hidden
    document.getElementById('avatar-wrap').innerHTML = makeAvatar(charRole);

  const strip = document.getElementById('experience');

function showLine(line, sub) {
  subCache = sub;
  const el = document.getElementById('char-line');
  el.textContent = line;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  const level = exchanges < 5 ? 'full' : exchanges < 10 ? 'soft' : 'demand';
  const subEl = document.getElementById('subtitle');
  const revBtn = document.getElementById('sub-reveal');
  if (level === 'full' && sub) {
    subEl.textContent = sub; subEl.className = 'subtitle'; revBtn.style.display = 'none';
  } else if (level === 'soft' && sub) {
    subEl.textContent = sub; subEl.className = 'subtitle soft'; revBtn.style.display = 'none';
  } else {
    subEl.textContent = ''; subEl.className = 'subtitle hidden';
    revBtn.style.display = sub ? 'block' : 'none'; revBtn.textContent = '¿qué significa?';
  }
  waitForVoices(line);
}

function revealSub() {
  const s = document.getElementById('subtitle');
  const b = document.getElementById('sub-reveal');
  if (s.classList.contains('hidden')) {
    s.textContent = subCache; s.className = 'subtitle soft'; b.textContent = 'ocultar';
  } else {
    s.className = 'subtitle hidden'; b.textContent = '¿qué significa?';
  }

function showNM(phrase, userText) {
  // Don't show if phrase is empty or same as what personaje just said
  if (!phrase || phrase.length < 3) return;
  nmPhrase = phrase;
  const h = document.getElementById('history');
  const t = document.getElementById('thinking');

  // Avoid duplicates - don't add if same phrase already shown
  const existing = h.querySelectorAll('.nm-hist .nm-hist-phrase');
  for (const el of existing) {
    if (el.textContent.replace(/[""]/g, '').trim() === phrase.trim()) return;
  }

  const card = document.createElement('div');
  card.className = 'nm-hist';
  card.innerHTML = 
    (userText ? '<span class="nm-hist-user">' + esc(userText) + '</span>' : '') +
    '<span class="nm-hist-tag">En inglés</span>' +
    '<span class="nm-hist-phrase">“' + esc(phrase) + '”</span>' +
    '<div class="nm-hist-actions">' +
      '<button class="nm-btn nm-listen" onclick="listenNM()">🔊 Escuchar</button>' +
      (recognition ? '<button class="nm-btn nm-listen" onclick="repeatNM()">🎙 Repetir</button>' : '') +
    '</div>';

  // Insert right after the last user message
  const userMsgs = h.querySelectorAll('.msg-user');
  const lastUser = userMsgs[userMsgs.length - 1];
  if (lastUser && lastUser.nextSibling) {
    h.insertBefore(card, lastUser.nextSibling);
  } else {
    h.insertBefore(card, t);
  }
  h.scrollTop = h.scrollHeight;
}

  m.className = 'msg msg-' + (role === 'char' ? 'char' : role === 'user' ? 'user' : 'system');

function saveConversation() {
  if (!situation) return;
  const msgs = [];
  document.getElementById('history').querySelectorAll('.msg-char, .msg-user').forEach(function(m) {
    const isChar = m.classList.contains('msg-char');
    const en = m.querySelector('.msg-en');
    const sub = m.querySelector('.msg-sub');
    const nm = m.querySelector('.msg-nm');
    msgs.push({
      role: isChar ? 'char' : 'user',
      text: en ? en.textContent : m.textContent,
      sub: sub ? sub.textContent : '',
      nm: nm ? nm.textContent : ''
    });
  });
  if (msgs.length === 0) return;
  let convs = JSON.parse(localStorage.getItem('liveit_convs') || '{}');
  convs[situation] = { situation: situation, msgs: msgs, date: new Date().toISOString() };
  localStorage.setItem('liveit_convs', JSON.stringify(convs));
}

function loadVoices() {} // Google TTS
function waitForVoices(text) { speak(text); }

let currentAudio = null;

async function speak(text) {
  if (!text) return;
  try {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    document.getElementById('speaking-dot').classList.add('on');
    isSpeaking = true;
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!data.audioContent) throw new Error('No audio');
    const audio = new Audio('data:audio/mp3;base64,' + data.audioContent);
    currentAudio = audio;
    audio.onended = () => { isSpeaking = false; document.getElementById('speaking-dot').classList.remove('on'); currentAudio = null; };
    audio.onerror = () => { isSpeaking = false; document.getElementById('speaking-dot').classList.remove('on'); };
    audio.play();
  } catch(e) {
    isSpeaking = false;
    document.getElementById('speaking-dot').classList.remove('on');
  }
}

function speakAt(text) { speak(text); }

    pl: 'Pisz po polsku lub angielsku…',
    ru: 'Пишите по-русски или по-английски…',
    zh: '用中文或英文输入…',
    ja: '日本語または英語で入力…',
    ar: 'اكتب بالعربية أو الإنجليزية…',
    tr: 'Türkçe veya İngilizce yaz…',
  };
  return placeholders[userLang] || placeholders['es'];
}

function initSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('mic-btn').style.display = 'none'; return; }
  recognition = new SR();
  recognition.interimResults = false;
  recognition.onresult = e => {
    document.getElementById('user-input').value = e.results[0][0].transcript;
    stopRec(); setTimeout(send, 300);
  };
  recognition.onerror = recognition.onend = () => stopRec();
}
function toggleMic() { isRec ? stopRec() : startRec(); }
function startRec() {
  if (!recognition) return;
  recognition.lang = enCount > esCount && enCount > 2 ? 'en-US' : 'es-ES';
  try { recognition.start(); } catch(e) {}
  isRec = true;
  const b = document.getElementById('mic-btn'); b.classList.add('rec');
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="9" width="6" height="6" rx="1"/></svg>';
}
function stopRec() {
  if (recognition) try { recognition.stop(); } catch(e) {}
  isRec = false;
  const b = document.getElementById('mic-btn'); b.classList.remove('rec');
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8" y1="23" x2="16" y2="23"/>
  </svg>`;
}

// ── UTILS ─────────────────────────────────────
function detectLang(t) {
  return /\b(el|la|los|las|un|una|que|de|en|con|por|para|tengo|quiero|necesito|es|son|hay|soy|pero|como|dónde|qué|cómo|sí|no|gracias|hola|buenos|buenas|quería|quisiera)\b/i.test(t) ? 'es' : 'en';
}
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
function autoResizeSit(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
</script>
